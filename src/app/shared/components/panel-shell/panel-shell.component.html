<a class="skip-link" href="#contenido-principal" (click)="skipToContent($event)">
  Saltar al contenido principal
</a>

<div class="shell">
  <header class="shell__header">
    <button
      type="button"
      class="shell__menu-toggle"
      [attr.aria-expanded]="navOpen()"
      [attr.aria-controls]="navId"
      (click)="toggleNav()"
    >
      Menú
    </button>
    <a class="shell__brand" routerLink="/">ArreglaloYA</a>
    <span class="shell__area">{{ areaLabel() }}</span>
    <app-user-menu class="shell__user" />
  </header>

  <nav
    class="shell__sidebar"
    [id]="navId"
    [class.is-open]="navOpen()"
    [attr.aria-label]="navLabel()"
  >
    <app-nav-list [items]="navItems()" (itemSelected)="closeNav()" />
  </nav>

  <main #main id="contenido-principal" class="shell__content" tabindex="-1">
    <ng-content />
  </main>
</div>
