<section class="auth-page" aria-labelledby="login-title">
  <div class="auth-card auth-card--narrow">
    <h1 id="login-title" class="auth-card__title">Iniciar sesión</h1>
    <p class="auth-card__intro">Ingrese con el correo electrónico y la contraseña de su cuenta.</p>

    @if (formError(); as message) {
      <div id="login-error-summary" class="form-alert" role="alert" tabindex="-1">
        {{ message }}
      </div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label class="field__label" for="login-email">Correo electrónico</label>
        <input
          id="login-email"
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          required
          [attr.aria-invalid]="errorFor('email') ? 'true' : null"
          [attr.aria-describedby]="describedBy('email')"
        />
        @if (errorFor('email'); as error) {
          <p id="login-email-error" class="field__error">{{ error }}</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="login-password">Contraseña</label>
        <div class="field__password">
          <input
            id="login-password"
            class="field__input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            required
            [attr.aria-invalid]="errorFor('password') ? 'true' : null"
            [attr.aria-describedby]="describedBy('password')"
          />
          <button
            type="button"
            class="field__toggle"
            aria-controls="login-password"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePassword()"
          >
            Mostrar<span class="sr-only"> contraseña</span>
          </button>
        </div>
        @if (errorFor('password'); as error) {
          <p id="login-password-error" class="field__error">{{ error }}</p>
        }
      </div>

      <button type="submit" class="form-submit" [disabled]="submitting()">
        {{ submitting() ? 'Iniciando sesión…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-card__footer">
      ¿No tiene una cuenta? <a routerLink="/auth/registro">Crear una cuenta</a>
    </p>
  </div>
</section>
